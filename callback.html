<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cliperstream - Login</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;line-height:1.6;color:#222}</style></head><body>
<h1>Cliperstream</h1>
<p id="msg">Returning to the Cliperstream app on your computer...</p>
<p>This page only passes the TikTok login result to the owner's local application (<code>localhost</code>). It stores nothing.</p>
<script>
(function () {
  var port = 8765;
  var q = location.search;
  if (!q) { document.getElementById("msg").textContent = "Nothing to do here: start the login from the Cliperstream app."; return; }
  var cible = "http://localhost:" + port + "/tiktok/retour" + q;
  document.getElementById("msg").innerHTML = 'Returning to the app... If nothing happens, make sure it is running, then <a href="' + cible.replace(/"/g, "&quot;") + '">continue</a>.';
  location.replace(cible);
})();
</script></body></html>
